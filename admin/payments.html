<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#F5C542;--gold-dark:#b8950e;--navy:#0a1628;--bg:var(--navy);--bg2:#0d1e36;--bg3:#122848;--border:rgba(245,197,66,0.15);--text:#f0f0f0;--muted:#8a9bb8;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;overflow-x:hidden;}

/* SIDEBAR */
.sidebar{width:220px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;overflow-y:auto;}
.sidebar-logo{padding:20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.logo-badge{background:var(--gold);color:#000;font-size:0.6rem;font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:1px;}
.logo-name{font-size:0.8rem;font-weight:700;color:#fff;line-height:1.2;}
.logo-sub{font-size:0.65rem;color:var(--muted);}
.sidebar-section{padding:12px 0;}
.sidebar-section-label{font-size:0.62rem;font-weight:700;color:#444;letter-spacing:1.5px;padding:0 16px;margin-bottom:6px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--muted);font-size:0.82rem;font-weight:500;cursor:pointer;transition:all 0.2s;text-decoration:none;border-left:3px solid transparent;position:relative;}
.nav-item:hover{color:#fff;background:rgba(255,255,255,0.04);}
.nav-item.active{color:var(--gold);background:rgba(245,197,66,0.08);border-left-color:var(--gold);}
.nav-item svg{width:16px;height:16px;flex-shrink:0;}
.sidebar-bottom{padding:14px 16px;border-top:1px solid var(--border);margin-top:auto;}
.admin-pill{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg3);border-radius:10px;}
.admin-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#b8950e,#F5C542);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.78rem;color:#000;flex-shrink:0;}
.admin-info{flex:1;min-width:0;}
.admin-name{font-size:0.75rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.admin-role{font-size:0.6rem;color:var(--gold);font-weight:600;}
.btn-so{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;}
.btn-so:hover{color:#ef4444;}

/* MAIN */
.main{margin-left:220px;flex:1;padding:24px;display:flex;flex-direction:column;min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.topbar-title{font-size:1.1rem;font-weight:800;color:#fff;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.scard{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;}
.scard-label{font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;}
.scard-value{font-size:1.5rem;font-weight:800;color:#fff;}
.filters{display:flex;gap:8px;margin-bottom:16px;}
.filter-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--muted);font-size:0.75rem;font-weight:600;cursor:pointer;transition:all 0.2s;}
.filter-btn.active{background:rgba(245,197,66,0.15);border-color:rgba(245,197,66,0.4);color:var(--gold);}
.table-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{font-size:0.63rem;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:0.5px;padding:12px 16px;text-align:left;border-bottom:1px solid var(--border);}
td{font-size:0.8rem;color:var(--text);padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.03);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,0.02);}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--gold-dark),var(--gold));display:inline-flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;color:#000;margin-right:8px;vertical-align:middle;}
.badge{padding:3px 9px;border-radius:10px;font-size:0.65rem;font-weight:700;}
.badge-success{background:rgba(34,197,94,0.15);color:#22c55e;}
.badge-pending{background:rgba(245,178,66,0.15);color:#f59e0b;}
.badge-failed{background:rgba(239,68,68,0.15);color:#ef4444;}
.badge-refunded{background:rgba(248,113,113,0.12);color:#f87171;}
.source-tag{font-size:0.65rem;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,0.06);color:var(--muted);}
.spinner{width:28px;height:28px;border:3px solid rgba(245,197,66,0.15);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:40px auto;display:block;}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.stats-row{grid-template-columns:repeat(2,1fr);}}
</style>
    <script src="../js/analytics.js"></script>
</head>

<div class="main">
  <span class="topbar-title">Payments</span>
  <div class="stats-row">
    <div class="scard"><div class="scard-label">Total Revenue</div><div class="scard-value" id="s-total">$0</div></div>
    <div class="scard"><div class="scard-label">This Month</div><div class="scard-value" id="s-month">$0</div></div>
    <div class="scard"><div class="scard-label">Pending</div><div class="scard-value" id="s-pending">0</div></div>
    <div class="scard"><div class="scard-label">Refunded</div><div class="scard-value" id="s-refunded">$0</div></div>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="setF('all',this)">All</button>
    <button class="filter-btn" onclick="setF('successful',this)">Successful</button>
    <button class="filter-btn" onclick="setF('pending',this)">Pending</button>
    <button class="filter-btn" onclick="setF('failed',this)">Failed</button>
    <button class="filter-btn" onclick="setF('refunded',this)">Refunded</button>
  </div>
  <div class="table-card">
    <table>
      <thead><tr><th>Client</th><th>Amount</th><th>Source</th><th>Status</th><th>Transaction ID</th><th>Date</th></tr></thead>
      <tbody id="tbody"><tr><td colspan="6"><div class="spinner"></div></td></tr></tbody>
    </table>
  </div>

<script>
const SB_URL='https://tjxyxasorunhrtvstwpa.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqeHl4YXNvcnVuaHJ0dnN0d3BhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNzU3NTQsImV4cCI6MjA5MjY1MTc1NH0.YEZPhnJmFAk4IDxd-6LlhKAZfGTkODfGr1FJteA99vo';
const sb=supabase.createClient(SB_URL,SB_KEY);
let payments=[],filter='all';
function av(n){return(n||'').split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2)||'?';}
function fc(a){return'$'+Number(a||0).toLocaleString();}
function fd(ts){return ts?new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';}
function badgeCls(s){return{successful:'badge-success',pending:'badge-pending',failed:'badge-failed',refunded:'badge-refunded'}[s]||'';}
async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='../login.html';return;}
  const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(!p||p.role!=='admin'){window.location.href='../login.html';return;}
  document.getElementById('admin-name').textContent=p.full_name||'Admin';
  document.getElementById('admin-avatar').textContent=(p.full_name||'A').split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2);
  const{data}=await sb.from('payments').select('*,profiles!payments_client_id_fkey(full_name,email)').order('created_at',{ascending:false});
  payments=data||[];
  const now=new Date(),month=now.getMonth(),year=now.getFullYear();
  const total=payments.filter(p=>p.status==='successful').reduce((s,p)=>s+Number(p.amount),0);
  const monthly=payments.filter(p=>p.status==='successful'&&new Date(p.created_at).getMonth()===month&&new Date(p.created_at).getFullYear()===year).reduce((s,p)=>s+Number(p.amount),0);
  const pending=payments.filter(p=>p.status==='pending').length;
  const refunded=payments.filter(p=>p.status==='refunded').reduce((s,p)=>s+Number(p.amount),0);
  document.getElementById('s-total').textContent=fc(total);
  document.getElementById('s-month').textContent=fc(monthly);
  document.getElementById('s-pending').textContent=pending;
  document.getElementById('s-refunded').textContent=fc(refunded);
  render();
}
function setF(f,el){filter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');render();}
function render(){
  const filtered=filter==='all'?payments:payments.filter(p=>p.status===filter);
  const tb=document.getElementById('tbody');
  if(!filtered.length){tb.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:30px;">No payments found</td></tr>';return;}
  tb.innerHTML=filtered.map(p=>`<tr>
    <td><span class="avatar">${av(p.profiles?.full_name)}</span>${p.profiles?.full_name||p.profiles?.email||'—'}</td>
    <td style="font-weight:700;color:#fff;">${fc(p.amount)}</td>
    <td><span class="source-tag">${(p.source||'agency_direct').replace('_',' ')}</span></td>
    <td><span class="badge ${badgeCls(p.status)}">${p.status}</span></td>
    <td style="font-size:0.7rem;color:var(--muted);font-family:monospace;">${p.transaction_id||p.paystack_reference||'—'}</td>
    <td style="color:var(--muted);">${fd(p.created_at)}</td>
  </tr>`).join('');
}
async function doSignOut(){await sb.auth.signOut();window.location.href='../login.html';}
init();
</script>
