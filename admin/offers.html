<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="../Logo/thegeniusagency.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#F5C542;--gold-dark:#b8950e;--navy:#0a1628;--bg:var(--navy);--bg2:#0d1e36;--bg3:#122848;--border:rgba(245,197,66,0.15);--text:#f0f0f0;--muted:#8a9bb8;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;overflow-x:hidden;}

/* SIDEBAR */
.sidebar{width:220px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;overflow-y:auto;}
.sidebar-logo{padding:20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.logo-badge{background:var(--gold);color:#000;font-size:0.6rem;font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:1px;}
.logo-name{font-size:0.8rem;font-weight:700;color:#fff;line-height:1.2;}
.logo-sub{font-size:0.65rem;color:var(--muted);}
.sidebar-section{padding:12px 0;}
.sidebar-section-label{font-size:0.62rem;font-weight:700;color:#444;letter-spacing:1.5px;padding:0 16px;margin-bottom:6px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--muted);font-size:0.82rem;font-weight:500;cursor:pointer;transition:all 0.2s;text-decoration:none;border-left:3px solid transparent;position:relative;}
.nav-item:hover{color:#fff;background:rgba(255,255,255,0.04);}
.nav-item.active{color:var(--gold);background:rgba(245,197,66,0.08);border-left-color:var(--gold);}
.nav-item svg{width:16px;height:16px;flex-shrink:0;}
.sidebar-bottom{padding:14px 16px;border-top:1px solid var(--border);margin-top:auto;}
.admin-pill{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg3);border-radius:10px;}
.admin-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#b8950e,#F5C542);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.78rem;color:#000;flex-shrink:0;}
.admin-info{flex:1;min-width:0;}
.admin-name{font-size:0.75rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.admin-role{font-size:0.6rem;color:var(--gold);font-weight:600;}
.btn-so{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;}
.btn-so:hover{color:#ef4444;}

/* MAIN */
.main{margin-left:220px;flex:1;padding:24px;display:flex;flex-direction:column;min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.topbar-title{font-size:1.1rem;font-weight:800;color:#fff;}
.filters{display:flex;gap:8px;margin-bottom:20px;}
.filter-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--muted);font-size:0.75rem;font-weight:600;cursor:pointer;transition:all 0.2s;}
.filter-btn.active{background:rgba(245,197,66,0.15);border-color:rgba(245,197,66,0.4);color:var(--gold);}
.offers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.offer-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px;transition:all 0.2s;}
.offer-card:hover{border-color:rgba(245,197,66,0.25);}
.oc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.oc-amount{font-size:1.5rem;font-weight:800;color:#fff;}
.badge{padding:4px 10px;border-radius:20px;font-size:0.65rem;font-weight:700;}
.badge-sent{background:rgba(245,197,66,0.15);color:var(--gold);}
.badge-accepted{background:rgba(34,197,94,0.15);color:#22c55e;}
.badge-paid{background:rgba(16,185,129,0.15);color:#10b981;}
.badge-rejected{background:rgba(239,68,68,0.15);color:#ef4444;}
.badge-expired{background:rgba(107,114,128,0.15);color:#6b7280;}
.badge-draft{background:rgba(139,92,246,0.15);color:#8b5cf6;}
.oc-meta{font-size:0.78rem;color:var(--muted);display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.oc-desc{font-size:0.78rem;color:#aaa;line-height:1.5;margin-bottom:14px;}
.oc-footer{display:flex;justify-content:space-between;align-items:center;}
.oc-date{font-size:0.7rem;color:var(--muted);}
.btn-sm{padding:5px 11px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--muted);font-size:0.72rem;cursor:pointer;transition:all 0.2s;}
.btn-sm:hover{border-color:rgba(245,197,66,0.35);color:var(--gold);}
.spinner{width:28px;height:28px;border:3px solid rgba(245,197,66,0.15);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:40px auto;display:block;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
    <script src="../js/analytics.js"></script>
</head>

<div class="main">
  <span class="topbar-title">Offers</span>
  <div class="filters">
    <button class="filter-btn active" onclick="setF('all',this)">All</button>
    <button class="filter-btn" onclick="setF('draft',this)">Draft</button>
    <button class="filter-btn" onclick="setF('sent',this)">Sent</button>
    <button class="filter-btn" onclick="setF('accepted',this)">Accepted</button>
    <button class="filter-btn" onclick="setF('paid',this)">Paid</button>
    <button class="filter-btn" onclick="setF('rejected',this)">Rejected</button>
  </div>
  <div id="grid"><div class="spinner"></div></div>
</div>
<script>
const SB_URL='https://tjxyxasorunhrtvstwpa.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqeHl4YXNvcnVuaHJ0dnN0d3BhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNzU3NTQsImV4cCI6MjA5MjY1MTc1NH0.YEZPhnJmFAk4IDxd-6LlhKAZfGTkODfGr1FJteA99vo';
const sb=supabase.createClient(SB_URL,SB_KEY);
let offers=[],filter='all';
function fc(a){return'$'+Number(a||0).toLocaleString();}
function fd(ts){return ts?new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';}
function badgeCls(s){return{sent:'badge-sent',accepted:'badge-accepted',paid:'badge-paid',rejected:'badge-rejected',expired:'badge-expired',draft:'badge-draft'}[s]||'badge-draft';}
async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='../login.html';return;}
  const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(!p||p.role!=='admin'){window.location.href='../login.html';return;}
  document.getElementById('admin-name').textContent=p.full_name||'Admin';
  document.getElementById('admin-avatar').textContent=(p.full_name||'A').split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2);
  const{data}=await sb.from('offers').select('*,conversations(client_id,profiles!conversations_client_id_fkey(full_name))').order('created_at',{ascending:false});
  offers=data||[];render();
}
async function doSignOut(){await sb.auth.signOut();window.location.href='../login.html';}
function setF(f,el){filter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');render();}
function render(){
  const filtered=filter==='all'?offers:offers.filter(o=>o.status===filter);
  const g=document.getElementById('grid');
  if(!filtered.length){g.innerHTML='<div style="text-align:center;padding:60px;color:var(--muted);">No offers found</div>';return;}
  g.innerHTML='<div class="offers-grid">'+filtered.map(o=>{
    const clientName=o.conversations?.profiles?.full_name||'Unknown Client';
    return`<div class="offer-card">
      <div class="oc-header">
        <div class="oc-amount">${fc(o.price)}</div>
        <span class="badge ${badgeCls(o.status)}">${o.status}</span>
      </div>
      <div class="oc-meta">
        <span>👤 ${clientName}</span>
        <span>📅 ${o.delivery_days} days delivery</span>
        <span>🔄 ${o.revisions||1} revision(s)</span>
      </div>
      ${o.description?`<div class="oc-desc">${o.description}</div>`:''}
      <div class="oc-footer">
        <span class="oc-date">${fd(o.created_at)}</span>
        <button class="btn-sm" onclick="window.location.href='chat.html?cid=${o.conversation_id}'">View Chat</button>
      </div>
    </div>`;
  }).join('')+'</div>';
}
init();
</script>
