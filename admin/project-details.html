<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Details | Admin | THE GENIUS AGENCY</title>
<link rel="icon" type="image/png" href="../Logo/thegeniusagency.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
    --gold: #F5C542;
    --gold-dark: #b8950e;
    --bg: #0a1628;
    --bg2: #0d1e36;
    --border: rgba(245,197,66,0.15);
    --text: #f0f0f0;
    --muted: #8a9bb8;
    --green: #10b981;
    --red: #ef4444;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 40px 20px; }
.container { max-width: 900px; margin: 0 auto; }

/* BACK BUTTON */
.btn-back { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); text-decoration: none; font-size: 0.85rem; font-weight: 600; margin-bottom: 24px; transition: 0.2s; }
.btn-back:hover { color: var(--gold); }

/* HEADER & TIMER */
.project-header { background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 32px; margin-bottom: 24px; position: relative; overflow: hidden; }
.timer-wrap { text-align: center; margin-bottom: 20px; }
.timer-label { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 8px; }
.timer-clock { font-size: 3.5rem; font-weight: 900; letter-spacing: -1px; transition: color 0.3s; }
.timer-green { color: var(--green); text-shadow: 0 0 30px rgba(16,185,129,0.3); }
.timer-red { color: var(--red); text-shadow: 0 0 30px rgba(239,68,68,0.3); }

/* INFO GRID */
.info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 24px; }
.info-item label { display: block; font-size: 0.65rem; color: var(--muted); text-transform: uppercase; font-weight: 800; margin-bottom: 4px; }
.info-item span { font-size: 1rem; font-weight: 700; color: #fff; }

/* DELIVERY BOX */
.delivery-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 32px; }
.section-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
.form-group { margin-bottom: 20px; }
.form-label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 8px; color: var(--muted); }
.file-drop { border: 2px dashed var(--border); border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: 0.2s; background: rgba(0,0,0,0.1); }
.file-drop:hover { border-color: var(--gold); background: rgba(245,197,66,0.05); }
.file-drop.has-file { border-style: solid; border-color: var(--green); background: rgba(16,185,129,0.05); }
.note-area { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 12px; padding: 15px; color: #fff; font-family: inherit; font-size: 0.9rem; min-height: 120px; outline: none; transition: 0.2s; }
.note-area:focus { border-color: var(--gold); }
.btn-deliver { width: 100%; padding: 16px; background: var(--gold); color: #000; border: none; border-radius: 12px; font-weight: 900; font-size: 1rem; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn-deliver:hover { background: var(--gold-dark); color: #fff; transform: translateY(-2px); }
.btn-deliver:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.loading-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.spinner { width: 40px; height: 40px; border: 4px solid rgba(245,197,66,0.1); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="loading-screen" id="loading-screen"><div class="spinner"></div></div>

<div class="container">
    <a href="projects.html" class="btn-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="15 18 9 12 15 6"/></svg>
        Back to Projects
    </a>

    <div class="project-header">
        <div class="timer-wrap">
            <div class="timer-label" id="status-text">Time Remaining</div>
            <div class="timer-clock timer-green" id="countdown">00:00:00:00</div>
        </div>

        <h1 id="proj-title" style="font-size: 1.5rem; margin-bottom: 8px;">Loading Project...</h1>
        <p id="proj-client" style="color: var(--gold); font-weight: 700; font-size: 0.9rem;"></p>

        <div class="info-grid">
            <div class="info-item"><label>Budget</label><span id="proj-budget">—</span></div>
            <div class="info-item"><label>Expert</label><span id="proj-expert">—</span></div>
            <div class="info-item"><label>Status</label><span id="proj-status">—</span></div>
        </div>
    </div>

    <div class="delivery-section" id="delivery-box">
        <h2 class="section-title">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            Deliver Completed Work
        </h2>
        
        <div class="form-group">
            <label class="form-label">Upload Final Files (.zip, .pdf, etc.)</label>
            <div class="file-drop" id="drop-zone" onclick="document.getElementById('file-input').click()">
                <div id="drop-text">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2" style="margin-bottom:12px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <p style="font-weight:700; color:#fff;">Click to select file</p>
                    <p style="font-size:0.75rem; color:var(--muted); margin-top:4px;">Maximum size: 50MB</p>
                </div>
            </div>
            <input type="file" id="file-input" style="display:none;">
        </div>

        <div class="form-group">
            <label class="form-label">Message to Client</label>
            <textarea class="note-area" id="delivery-note" placeholder="Hi! I have completed your project. Here are the final files..."></textarea>
        </div>

        <button class="btn-deliver" id="deliver-btn" onclick="submitDelivery()">
            Submit Final Delivery
        </button>
    </div>
</div>

<script>
const SB_URL='https://tjxyxasorunhrtvstwpa.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqeHl4YXNvcnVuaHJ0dnN0d3BhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNzU3NTQsImV4cCI6MjA5MjY1MTc1NH0.YEZPhnJmFAk4IDxd-6LlhKAZfGTkODfGr1FJteA99vo';
const sb=supabase.createClient(SB_URL,SB_KEY);

const projId = new URLSearchParams(location.search).get('id');
let projectData = null;
let timerInterval = null;

async function init() {
    if (!projId) { window.location.href = 'projects.html'; return; }
    
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = '../login.html'; return; }

    const { data: proj, error } = await sb.from('projects')
        .select('*, profiles(full_name, email), experts(name)')
        .eq('id', projId)
        .single();

    if (error || !proj) { alert('Project not found'); window.location.href = 'projects.html'; return; }
    
    projectData = proj;
    renderDetails();
    startCountdown(proj.deadline);
    document.getElementById('loading-screen').style.display = 'none';
}

function renderDetails() {
    document.getElementById('proj-title').textContent = projectData.title || 'Untitled Project';
    document.getElementById('proj-client').textContent = `CLIENT: ${projectData.profiles?.full_name || 'Unknown'}`;
    document.getElementById('proj-budget').textContent = projectData.budget ? `$${Number(projectData.budget).toLocaleString()}` : '—';
    document.getElementById('proj-expert').textContent = projectData.experts?.name || 'Unassigned';
    document.getElementById('proj-status').textContent = projectData.status.toUpperCase().replace('_', ' ');
    
    if (projectData.status === 'delivered' || projectData.status === 'completed') {
        document.getElementById('delivery-box').style.display = 'none';
        document.getElementById('status-text').textContent = 'Project Status';
        document.getElementById('countdown').textContent = projectData.status.toUpperCase();
    }
}

function startCountdown(deadline) {
    if (!deadline) {
        document.getElementById('countdown').textContent = 'NO DEADLINE';
        return;
    }

    const update = () => {
        const now = new Date().getTime();
        const dest = new Date(deadline).getTime();
        const diff = dest - now;

        if (diff <= 0) {
            document.getElementById('countdown').textContent = 'EXPIRED';
            document.getElementById('countdown').className = 'timer-clock timer-red';
            clearInterval(timerInterval);
            return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('countdown').textContent = 
            `${days.toString().padStart(2,'0')}d : ${hours.toString().padStart(2,'0')}h : ${mins.toString().padStart(2,'0')}m : ${secs.toString().padStart(2,'0')}s`;

        // Turn Red if less than 12 hours
        if (diff < (12 * 60 * 60 * 1000)) {
            document.getElementById('countdown').className = 'timer-clock timer-red';
        } else {
            document.getElementById('countdown').className = 'timer-clock timer-green';
        }
    };

    update();
    timerInterval = setInterval(update, 1000);
}

// File handling
const fileInput = document.getElementById('file-input');
const dropZone = document.getElementById('drop-zone');
fileInput.onchange = () => {
    if (fileInput.files[0]) {
        dropZone.classList.add('has-file');
        document.getElementById('drop-text').innerHTML = `<p style="color:var(--green); font-weight:800;">✓ ${fileInput.files[0].name}</p><p style="font-size:0.7rem; color:var(--muted);">Click to change file</p>`;
    }
};

async function submitDelivery() {
    const file = fileInput.files[0];
    const note = document.getElementById('delivery-note').value.trim();
    const btn = document.getElementById('deliver-btn');

    if (!file) { alert('Please upload the project files first.'); return; }
    if (!confirm('Are you sure you want to submit this delivery?')) return;

    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="width:20px; height:20px; margin:0;"></div> Uploading...';

    try {
        // 1. Upload to storage
        const path = `deliveries/${projId}/${Date.now()}_${file.name}`;
        const { data: up, error: upErr } = await sb.storage.from('uploads').upload(path, file);
        if (upErr) throw upErr;
        const { data: urlData } = sb.storage.from('uploads').getPublicUrl(path);
        const fileUrl = urlData.publicUrl;

        // 2. Find conversation to send message
        const { data: conv } = await sb.from('conversations').select('id').eq('project_id', projId).single();
        
        if (conv) {
            // 3. Create Delivery record
            const { data: deliv } = await sb.from('deliveries').insert({
                conversation_id: conv.id,
                content: note || 'Project files delivered.',
                file_url: fileUrl,
                status: 'pending'
            }).select().single();

            // 4. Send message to client
            await sb.from('messages').insert({
                conversation_id: conv.id,
                sender_id: (await sb.auth.getUser()).data.user.id,
                sender_role: 'admin',
                content: note || 'Final work delivered!',
                message_type: 'delivery',
                metadata: { file_url: fileUrl, file_name: file.name, delivery_id: deliv?.id }
            });
        }

        // 5. Update Project Status
        await sb.from('projects').update({ 
            status: 'delivered', 
            delivered_at: new Date().toISOString() 
        }).eq('id', projId);

        // 6. Notify Client via Email
        fetch('/api/notifications/notify-admin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                type: 'project_delivered',
                data: {
                    client_name: projectData.profiles?.full_name,
                    client_email: projectData.profiles?.email,
                    project_title: projectData.title
                }
            })
        });

        alert('Project delivered successfully!');
        window.location.href = 'projects.html';

    } catch (err) {
        console.error(err);
        alert('Delivery failed: ' + err.message);
        btn.disabled = false;
        btn.innerHTML = 'Submit Final Delivery';
    }
}

init();
</script>
</body>
</html>
