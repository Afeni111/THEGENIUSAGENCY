<html lang="en">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#F5C542;--gold-dark:#b8950e;--navy:#0a1628;--bg:var(--navy);--bg2:#0d1e36;--bg3:#122848;--border:rgba(245,197,66,0.15);--text:#f0f0f0;--muted:#8a9bb8;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;overflow-x:hidden;}

/* SIDEBAR */
.sidebar{width:220px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;overflow-y:auto;}
.sidebar-logo{padding:20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.logo-badge{background:var(--gold);color:#000;font-size:0.6rem;font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:1px;}
.logo-name{font-size:0.8rem;font-weight:700;color:#fff;line-height:1.2;}
.logo-sub{font-size:0.65rem;color:var(--muted);}
.sidebar-section{padding:12px 0;}
.sidebar-section-label{font-size:0.62rem;font-weight:700;color:#444;letter-spacing:1.5px;padding:0 16px;margin-bottom:6px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--muted);font-size:0.82rem;font-weight:500;cursor:pointer;transition:all 0.2s;text-decoration:none;border-left:3px solid transparent;position:relative;}
.nav-item:hover{color:#fff;background:rgba(255,255,255,0.04);}
.nav-item.active{color:var(--gold);background:rgba(245,197,66,0.08);border-left-color:var(--gold);}
.nav-item svg{width:16px;height:16px;flex-shrink:0;}
.sidebar-bottom{padding:14px 16px;border-top:1px solid var(--border);margin-top:auto;}
.admin-pill{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg3);border-radius:10px;}
.admin-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#b8950e,#F5C542);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.78rem;color:#000;flex-shrink:0;}
.admin-info{flex:1;min-width:0;}
.admin-name{font-size:0.75rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.admin-role{font-size:0.6rem;color:var(--gold);font-weight:600;}
.btn-so{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;}
.btn-so:hover{color:#ef4444;}

/* MAIN */
.main{margin-left:220px;flex:1;padding:24px;display:flex;flex-direction:column;min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.topbar-title{font-size:1.1rem;font-weight:800;color:#fff;}
.btn-primary{background:var(--gold);color:#000;border:none;padding:10px 20px;border-radius:8px;font-weight:700;font-size:0.82rem;cursor:pointer;transition:all 0.2s;}
.btn-primary:hover{background:var(--gold-dark);color:#fff;}
.experts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.expert-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px;transition:all 0.2s;}
.expert-card:hover{border-color:rgba(245,197,66,0.25);}
.ec-top{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.ec-img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid rgba(245,197,66,0.2);background:var(--bg3);}
.ec-img-placeholder{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--gold-dark),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;color:#000;flex-shrink:0;}
.ec-info{flex:1;min-width:0;}
.ec-name{font-size:0.9rem;font-weight:700;color:#fff;margin-bottom:2px;}
.ec-role{font-size:0.72rem;color:var(--gold);}
.ec-status{display:flex;align-items:center;gap:6px;margin-top:4px;}
.status-dot{width:6px;height:6px;border-radius:50%;}
.ec-skills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.skill-tag{padding:3px 8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:6px;font-size:0.65rem;color:var(--muted);}
.ec-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.ec-stat{text-align:center;background:var(--bg3);border-radius:8px;padding:8px;}
.ec-stat-val{font-size:0.9rem;font-weight:700;color:#fff;}
.ec-stat-lbl{font-size:0.6rem;color:var(--muted);}
.ec-actions{display:flex;gap:8px;}
.btn-sm{padding:6px 12px;border-radius:7px;border:1px solid var(--border);background:none;color:var(--muted);font-size:0.73rem;font-weight:600;cursor:pointer;transition:all 0.2s;flex:1;text-align:center;}
.btn-sm:hover{border-color:rgba(245,197,66,0.4);color:var(--gold);}
.btn-danger{border-color:rgba(239,68,68,0.3);color:#ef4444;}
.btn-danger:hover{background:rgba(239,68,68,0.08);}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#161616;border:1px solid rgba(245,197,66,0.2);border-radius:18px;padding:28px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;}
.modal::-webkit-scrollbar{width:4px;}
.modal::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);}
.modal-title{font-size:1rem;font-weight:700;color:#fff;margin-bottom:20px;}
.form-group{margin-bottom:14px;}
.form-label{font-size:0.7rem;font-weight:700;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:5px;display:block;}
.form-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:#fff;font-size:0.86rem;outline:none;font-family:inherit;transition:border-color 0.2s;}
.form-input:focus{border-color:rgba(245,197,66,0.4);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.btn-cancel{flex:1;padding:11px;background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;cursor:pointer;font-weight:600;font-size:0.85rem;}
.btn-save{flex:2;padding:11px;background:var(--gold);border:none;color:#000;border-radius:8px;cursor:pointer;font-weight:700;font-size:0.85rem;}
.btn-save:hover{background:var(--gold-dark);color:#fff;}
.spinner{width:28px;height:28px;border:3px solid rgba(245,197,66,0.15);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:40px auto;display:block;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px;color:var(--muted);}
</style>
    <script src="../js/analytics.js"></script>
</head>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modal" style="display:none;">
  <div class="modal">
    <div class="modal-title" id="modal-title">Add Expert</div>
    <input type="hidden" id="edit-id">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input class="form-input" id="f-name" placeholder="e.g. John Doe">
      </div>
      <div class="form-group">
        <label class="form-label">Role / Specialty</label>
        <input class="form-input" id="f-role" placeholder="e.g. Web Designer">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">General Bio</label>
      <textarea class="form-input" id="f-bio" rows="2" placeholder="Brief professional bio..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Services Description (Public Modal)</label>
      <textarea class="form-input" id="f-services-desc" rows="3" placeholder="Compelling description of specific services..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Detailed Services (comma-separated list)</label>
      <input class="form-input" id="f-services-list" placeholder="e.g. Website Design, SEO, Branding">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Location</label>
        <input class="form-input" id="f-location" placeholder="e.g. London, UK">
      </div>
      <div class="form-group">
        <label class="form-label">Image URL</label>
        <input class="form-input" id="f-image" placeholder="Freelancer Photos/name.png">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Upwork URL</label>
        <input class="form-input" id="f-upwork" placeholder="https://upwork.com/...">
      </div>
      <div class="form-group">
        <label class="form-label">Fiverr URL</label>
        <input class="form-input" id="f-fiverr" placeholder="https://fiverr.com/...">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Rating (1-5)</label>
        <input class="form-input" id="f-rating" type="number" min="1" max="5" step="0.1" placeholder="5.0">
      </div>
      <div class="form-group">
        <label class="form-label">Response Time</label>
        <input class="form-input" id="f-response" placeholder="e.g. Within 2 hours">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Skills (comma-separated)</label>
      <input class="form-input" id="f-skills" placeholder="e.g. React, Node.js, Python">
    </div>

      <label class="form-label">Availability</label>

        <option value="Busy">Busy</option>
        <option value="Unavailable">Unavailable</option>
      </select>
    </div>

      <button class="btn-save" onclick="saveExpert()">Save Expert</button>

<script>
const SB_URL='https://tjxyxasorunhrtvstwpa.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqeHl4YXNvcnVuaHJ0dnN0d3BhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNzU3NTQsImV4cCI6MjA5MjY1MTc1NH0.YEZPhnJmFAk4IDxd-6LlhKAZfGTkODfGr1FJteA99vo';
const sb=supabase.createClient(SB_URL,SB_KEY);
let experts=[];
function av(n){return(n||'').split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2)||'?';}

async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='../login.html';return;}
  const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(!p||p.role!=='admin'){window.location.href='../login.html';return;}
  document.getElementById('admin-name').textContent=p.full_name||'Admin';
  document.getElementById('admin-avatar').textContent=(p.full_name||'A').split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2);
  await loadExperts();
}
async function doSignOut(){await sb.auth.signOut();window.location.href='../login.html';}

async function loadExperts(){
  const{data}=await sb.from('experts').select('*').order('created_at',{ascending:false});
  experts=data||[];render();
}

function render(){
  const g=document.getElementById('grid');
  if(!experts.length){g.innerHTML='<div class="empty">No experts yet. Click "Add Expert" to get started.</div>';return;}
  g.innerHTML='<div class="experts-grid">'+experts.map(e=>`
    <div class="expert-card">
      <div class="ec-top">
        ${e.image_url?`<img class="ec-img" src="../${e.image_url}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" alt=""><div class="ec-img-placeholder" style="display:none;">${av(e.name)}</div>`:`<div class="ec-img-placeholder">${av(e.name)}</div>`}
        <div class="ec-info">
          <div class="ec-name">${e.name}</div>
          <div class="ec-role">${e.role}</div>
          <div class="ec-status">
            <div class="status-dot" style="background:${e.is_active?'#22c55e':'#6b7280'};"></div>
            <span style="font-size:0.65rem;color:${e.is_active?'#22c55e':'#6b7280'};">${e.availability||'Available'}</span>
          </div>
        </div>
      </div>
      ${e.skills?.length?`<div class="ec-skills">${e.skills.slice(0,4).map(s=>`<span class="skill-tag">${s}</span>`).join('')}${e.skills.length>4?`<span class="skill-tag">+${e.skills.length-4}</span>`:''}</div>`:''}
      <div class="ec-stats">
        <div class="ec-stat"><div class="ec-stat-val">⭐ ${e.rating||'5.0'}</div><div class="ec-stat-lbl">Rating</div></div>
        <div class="ec-stat"><div class="ec-stat-val">${e.total_projects||0}</div><div class="ec-stat-lbl">Projects</div></div>
        <div class="ec-stat"><div class="ec-stat-val">${e.total_reviews||0}</div><div class="ec-stat-lbl">Reviews</div></div>
      </div>
      <div class="ec-actions">
        <button class="btn-sm" onclick="editExpert('${e.id}')">✏️ Edit</button>
        <button class="btn-sm ${e.is_active?'btn-danger':''}" onclick="toggleActive('${e.id}',${!e.is_active})">${e.is_active?'Deactivate':'Activate'}</button>
      </div>
    </div>`).join('')+'</div>';
}

function openModal(id){
  document.getElementById('modal').style.display='flex';
  document.getElementById('modal-title').textContent=id?'Edit Expert':'Add Expert';
  document.getElementById('edit-id').value=id||'';
  if(!id){['f-name','f-role','f-bio','f-location','f-image','f-upwork','f-fiverr','f-skills','f-response','f-services-desc','f-services-list'].forEach(i=>document.getElementById(i).value='');document.getElementById('f-rating').value='5.0';document.getElementById('f-availability').value='Available';}
}

function editExpert(id){
  const e=experts.find(x=>x.id===id);if(!e)return;
  openModal(id);
  document.getElementById('f-name').value=e.name||'';
  document.getElementById('f-role').value=e.role||'';
  document.getElementById('f-bio').value=e.bio||'';
  document.getElementById('f-location').value=e.location||'';
  document.getElementById('f-image').value=e.image_url||'';
  document.getElementById('f-upwork').value=e.upwork_url||'';
  document.getElementById('f-fiverr').value=e.fiverr_url||'';
  document.getElementById('f-rating').value=e.rating||'5.0';
  document.getElementById('f-response').value=e.response_time||'';
  document.getElementById('f-skills').value=(e.skills||[]).join(', ');
  document.getElementById('f-services-desc').value=e.services_desc||'';
  document.getElementById('f-services-list').value=(e.services_list||[]).join(', ');
  document.getElementById('f-availability').value=e.availability||'Available';
}

async function saveExpert(){
  const id=document.getElementById('edit-id').value;
  const skillsRaw=document.getElementById('f-skills').value;
  const payload={
    name:document.getElementById('f-name').value.trim(),
    role:document.getElementById('f-role').value.trim(),
    bio:document.getElementById('f-bio').value.trim(),
    location:document.getElementById('f-location').value.trim(),
    image_url:document.getElementById('f-image').value.trim(),
    upwork_url:document.getElementById('f-upwork').value.trim(),
    fiverr_url:document.getElementById('f-fiverr').value.trim(),
    rating:parseFloat(document.getElementById('f-rating').value)||5.0,
    response_time:document.getElementById('f-response').value.trim(),
    skills:skillsRaw?skillsRaw.split(',').map(s=>s.trim()).filter(Boolean):[],
    services_desc:document.getElementById('f-services-desc').value.trim(),
    services_list:document.getElementById('f-services-list').value?document.getElementById('f-services-list').value.split(',').map(s=>s.trim()).filter(Boolean):[],
    availability:document.getElementById('f-availability').value
  };
  if(!payload.name||!payload.role){alert('Name and role are required.');return;}
  if(id){await sb.from('experts').update(payload).eq('id',id);}
  else{await sb.from('experts').insert({...payload,is_active:true});}
  closeModal();await loadExperts();
}

async function toggleActive(id,val){
  await sb.from('experts').update({is_active:val}).eq('id',id);
  const idx=experts.findIndex(e=>e.id===id);if(idx>-1)experts[idx].is_active=val;render();
}

function closeModal(){document.getElementById('modal').style.display='none';}
init();
</script>
</body>
</html>
