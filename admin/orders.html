<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#F5C542;--gold-dark:#b8950e;--navy:#0a1628;--bg:var(--navy);--bg2:#0d1e36;--bg3:#122848;--border:rgba(245,197,66,0.15);--text:#f0f0f0;--muted:#8a9bb8;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;}
.sidebar{width:220px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;overflow-y:auto;}
.sidebar-logo{padding:20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.logo-badge{background:var(--gold);color:#000;font-size:0.6rem;font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:1px;}
.logo-name{font-size:0.8rem;font-weight:700;color:#fff;line-height:1.2;}
.logo-sub{font-size:0.65rem;color:var(--muted);}
.sidebar-section{padding:12px 0;}
.sidebar-section-label{font-size:0.62rem;font-weight:700;color:#444;letter-spacing:1.5px;padding:0 16px;margin-bottom:6px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--muted);font-size:0.82rem;font-weight:500;cursor:pointer;transition:all 0.2s;text-decoration:none;border-left:3px solid transparent;position:relative;}
.nav-item:hover{color:#fff;background:rgba(255,255,255,0.04);}
.nav-item.active{color:var(--gold);background:rgba(245,197,66,0.08);border-left-color:var(--gold);}
.nav-item svg{width:16px;height:16px;flex-shrink:0;}
.sidebar-bottom{padding:14px 16px;border-top:1px solid var(--border);margin-top:auto;}
.admin-pill{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg3);border-radius:10px;}
.admin-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#b8950e,#F5C542);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.78rem;color:#000;flex-shrink:0;}
.admin-info{flex:1;min-width:0;}
.admin-name{font-size:0.75rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.admin-role{font-size:0.6rem;color:var(--gold);font-weight:600;}
.btn-so{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;}
.btn-so:hover{color:#ef4444;}

.main{margin-left:220px;flex:1;padding:24px;display:flex;flex-direction:column;height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.topbar-title{font-size:1.2rem;font-weight:800;color:#fff;}

.table-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px;flex:1;display:flex;flex-direction:column;overflow:hidden;}
.table-header-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.search-wrap{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 14px;width:300px;}
.search-wrap input{background:none;border:none;outline:none;color:#fff;font-size:0.85rem;flex:1;}
.search-wrap input::placeholder{color:var(--muted);}

.table-container{flex:1;overflow-y:auto;}
table{width:100%;border-collapse:collapse;min-width:800px;}
th{font-size:0.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding:0 15px 12px 15px;text-align:left;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:10;}
td{font-size:0.85rem;color:var(--text);padding:15px;border-bottom:1px solid rgba(255,255,255,0.04);}
tr:hover td{background:rgba(255,255,255,0.02);}

.td-id{font-family:monospace;color:var(--gold);font-weight:600;}
.td-name{font-weight:600;color:#fff;display:flex;align-items:center;gap:10px;}
.avatar-sm{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--gold-dark),var(--gold));display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;color:#000;}
.td-time{color:var(--muted);font-size:0.8rem;}

.status-pill{padding:4px 10px;border-radius:20px;font-size:0.7rem;font-weight:700;white-space:nowrap;}

.spinner{width:30px;height:30px;border:3px solid rgba(245,197,66,0.15);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:60px auto;display:block;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px;color:var(--muted);}
</style>
    <script src="../js/analytics.js"></script>
</head>

          <tr><td colspan="6"><div class="spinner"></div></td></tr>
        </tbody>

<script>
const SB_URL='https://tjxyxasorunhrtvstwpa.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqeHl4YXNvcnVuaHJ0dnN0d3BhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNzU3NTQsImV4cCI6MjA5MjY1MTc1NH0.YEZPhnJmFAk4IDxd-6LlhKAZfGTkODfGr1FJteA99vo';
const sb=supabase.createClient(SB_URL,SB_KEY);

let projects=[];

function av(n){return(n||'').split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2)||'?';}
function sc(s){const m={new_lead:'#3b82f6',discussing:'#8b5cf6',offer_sent:'#f59e0b',payment_pending:'#ef4444',in_progress:'#10b981',under_review:'#f97316',delivered:'#06b6d4',revision:'#ec4899',completed:'#22c55e',auto_completed:'#84cc16',cancelled:'#6b7280',refunded:'#f87171'};return m[s]||'#888';}
function sl(s){const m={new_lead:'New Lead',discussing:'Discussing',offer_sent:'Offer Sent',payment_pending:'Payment Pending',in_progress:'In Progress',under_review:'Under Review',delivered:'Delivered',revision:'Revision',completed:'Completed',auto_completed:'Auto Completed',cancelled:'Cancelled',refunded:'Refunded'};return m[s]||s;}
function ft(ts){
  if(!ts) return '—';
  return new Date(ts).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit'});
}
function fd(ts){
  if(!ts) return 'Not set';
  return new Date(ts).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='../login.html';return;}
  const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(!p||p.role!=='admin'){window.location.href='../login.html';return;}
  document.getElementById('admin-name').textContent=p.full_name||'Admin';
  document.getElementById('admin-avatar').textContent=(p.full_name||'A').split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2);
  
  // Exclude non-orders (new_lead, discussing) to strictly show actual orders.
  // Wait, the user said "Orders page which will show all orders". It is safe to show everything or just orders.
  // I will fetch all and then we can view everything as an order.
  const{data}=await sb.from('projects').select('*,profiles!projects_client_id_fkey(full_name,email)').order('created_at',{ascending:false});
  projects=data||[];
  render();
}

function render(){
  const q=document.getElementById('search').value.toLowerCase();
  
  // Filter for actual orders OR custom projects if we want.
  // Based on user feedback from previous session: "Order should only occurred when the offer has been accepted, I mean payed for".
  // So valid order statuses are: in_progress, under_review, delivered, revision, completed, auto_completed.
  const validOrderStatuses = ['in_progress', 'under_review', 'delivered', 'revision', 'completed', 'auto_completed', 'cancelled', 'refunded'];
  
  const filtered = projects.filter(p=>{
    if(!validOrderStatuses.includes(p.status)) return false;
    const idStr = p.id.split('-')[0].toLowerCase();
    if(q && !idStr.includes(q) && !(p.profiles?.full_name||'').toLowerCase().includes(q)) return false;
    return true;
  });

  const tb = document.getElementById('tbody-orders');
  if(!filtered.length){
    tb.innerHTML='<tr><td colspan="6"><div class="empty">No active orders found.</div></td></tr>';
    return;
  }

  tb.innerHTML=filtered.map(p=>{
    const col=sc(p.status);
    const name=p.profiles?.full_name||'Unknown';
    const orderId = p.id.split('-')[0].toUpperCase();
    
    return `<tr style="cursor:pointer;" onclick="window.location.href='chat.html?cid=${p.id}'">
      <td class="td-id">#${orderId}</td>
      <td>
        <div class="td-name">
          <span class="avatar-sm">${av(name)}</span>
          ${name}
        </div>
      </td>
      <td class="td-time">${ft(p.created_at)}</td>
      <td class="td-time" style="font-weight:600; color:#fff;">${fd(p.deadline)}</td>
      <td><span class="status-pill" style="background:${col}22;color:${col};">${sl(p.status)}</span></td>
      <td>
        <button style="background:none; border:none; color:var(--gold); font-size:0.8rem; font-weight:600; cursor:pointer;">Manage →</button>
      </td>
    </tr>`;
  }).join('');
}

async function doSignOut(){await sb.auth.signOut();window.location.href='../login.html';}
init();
</script>
</body>
