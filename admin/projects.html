<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#F5C542;--gold-dark:#b8950e;--navy:#0a1628;--bg:var(--navy);--bg2:#0d1e36;--bg3:#122848;--border:rgba(245,197,66,0.15);--text:#f0f0f0;--muted:#8a9bb8;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;overflow-x:hidden;}

/* SIDEBAR */
.sidebar{width:220px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;overflow-y:auto;}
.sidebar-logo{padding:20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.logo-badge{background:var(--gold);color:#000;font-size:0.6rem;font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:1px;}
.logo-name{font-size:0.8rem;font-weight:700;color:#fff;line-height:1.2;}
.logo-sub{font-size:0.65rem;color:var(--muted);}
.sidebar-section{padding:12px 0;}
.sidebar-section-label{font-size:0.62rem;font-weight:700;color:#444;letter-spacing:1.5px;padding:0 16px;margin-bottom:6px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--muted);font-size:0.82rem;font-weight:500;cursor:pointer;transition:all 0.2s;text-decoration:none;border-left:3px solid transparent;position:relative;}
.nav-item:hover{color:#fff;background:rgba(255,255,255,0.04);}
.nav-item.active{color:var(--gold);background:rgba(245,197,66,0.08);border-left-color:var(--gold);}
.nav-item svg{width:16px;height:16px;flex-shrink:0;}
.sidebar-bottom{padding:14px 16px;border-top:1px solid var(--border);margin-top:auto;}
.admin-pill{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg3);border-radius:10px;}
.admin-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#b8950e,#F5C542);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.78rem;color:#000;flex-shrink:0;}
.admin-info{flex:1;min-width:0;}
.admin-name{font-size:0.75rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.admin-role{font-size:0.6rem;color:var(--gold);font-weight:600;}
.btn-so{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;}
.btn-so:hover{color:#ef4444;}

/* MAIN */
.main{margin-left:220px;flex:1;padding:24px;display:flex;flex-direction:column;min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.topbar-title{font-size:1.1rem;font-weight:800;color:#fff;}
.btn-primary{background:var(--gold);color:#000;border:none;padding:10px 20px;border-radius:8px;font-weight:700;font-size:0.82rem;cursor:pointer;}
.btn-primary:hover{background:var(--gold-dark);color:#fff;}
.filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.filter-btn{padding:8px 18px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--muted);font-size:0.78rem;font-weight:600;cursor:pointer;transition:all 0.2s;}
.filter-btn.active{background:rgba(245,197,66,0.1);border-color:var(--gold);color:var(--gold);box-shadow: 0 0 15px rgba(245,197,66,0.1);}
.search-wrap{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;margin-bottom:20px;max-width:360px;}
.search-wrap input{background:none;border:none;outline:none;color:#fff;font-size:0.85rem;flex:1;}
.search-wrap input::placeholder{color:#555;}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
.project-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px;cursor:pointer;transition:all 0.2s;}
.project-card:hover{border-color:rgba(245,197,66,0.25);transform:translateY(-2px);}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.pc-title{font-size:0.9rem;font-weight:700;color:#fff;}
.status-pill{padding:4px 10px;border-radius:20px;font-size:0.65rem;font-weight:700;}
.pc-meta{font-size:0.75rem;color:var(--muted);margin-bottom:12px;display:flex;flex-direction:column;gap:4px;}
.pc-meta span{display:flex;align-items:center;gap:6px;}
.progress-bar{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;margin-bottom:12px;}
.progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gold-dark),var(--gold));}
.pc-footer{display:flex;justify-content:space-between;align-items:center;}
.pc-budget{font-size:0.9rem;font-weight:700;color:var(--gold);}
.pc-actions{display:flex;gap:6px;}
.btn-sm{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--muted);font-size:0.72rem;cursor:pointer;transition:all 0.2s;}
.btn-sm:hover{border-color:rgba(245,197,66,0.35);color:var(--gold);}
.spinner{width:30px;height:30px;border:3px solid rgba(245,197,66,0.15);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:60px auto;display:block;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px;color:var(--muted);}
</style>
    <script src="../js/analytics.js"></script>
</head>
<body>

        <div class="logo-sub">AGENCY</div>

  </div>

<div class="main">
  <div class="topbar">
    <span class="topbar-title">Projects</span>
  </div>
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search" placeholder="Search projects or clients..." oninput="render()">
  </div>
  <div class="filters" id="filters"></div>
  <div id="grid"></div>
</div>
<script>
const SB_URL='https://tjxyxasorunhrtvstwpa.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqeHl4YXNvcnVuaHJ0dnN0d3BhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNzU3NTQsImV4cCI6MjA5MjY1MTc1NH0.YEZPhnJmFAk4IDxd-6LlhKAZfGTkODfGr1FJteA99vo';
const sb=supabase.createClient(SB_URL,SB_KEY);
let projects=[],filter='all';
function sc(s){const m={new_lead:'#3b82f6',discussing:'#8b5cf6',offer_sent:'#f59e0b',payment_pending:'#ef4444',in_progress:'#10b981',under_review:'#f97316',delivered:'#06b6d4',revision:'#ec4899',late:'#f87171',dispute:'#ef4444',completed:'#22c55e',auto_completed:'#84cc16',cancelled:'#6b7280',refunded:'#f87171'};return m[s]||'#888';}
function sl(s){const m={all:'All Orders',new_lead:'New Lead',discussing:'Discussing',offer_sent:'Offer Sent',payment_pending:'Payment Pending',in_progress:'In Progress',under_review:'Under Review',delivered:'Delivered',revision:'In Revision',late:'Late',dispute:'In Dispute',completed:'Completed',auto_completed:'Auto Completed',cancelled:'Cancelled',refunded:'Refunded'};return m[s]||s;}
function fc(a){return a?'$'+Number(a).toLocaleString():'—';}
async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='../login.html';return;}
  const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(!p||p.role!=='admin'){window.location.href='../login.html';return;}
  document.getElementById('admin-name').textContent=p.full_name||'Admin';
  document.getElementById('admin-avatar').textContent=(p.full_name||'A').split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2);
  
  // Resilient Fetch: Try complex join first, then fallback to simple if needed
  let {data, error} = await sb.from('projects')
    .select('*, profiles(full_name,email), experts(name,image_url), conversations(id)')
    .order('updated_at',{ascending:false});
  
  if (error) {
    console.warn('Complex join failed, falling back to simple fetch:', error.message);
    const {data: simpleData, error: simpleError} = await sb.from('projects')
      .select('*')
      .order('updated_at',{ascending:false});
    
    if (simpleError) {
      console.error('Final fetch error:', simpleError);
      projects = [];
    } else {
      projects = simpleData || [];
    }
  } else {
    projects=data||[];
  }

  buildFilters();render();
}
async function doSignOut(){await sb.auth.signOut();window.location.href='../login.html';}
function buildFilters(){
  const statuses=['all','in_progress','delivered','revision','late','dispute','completed'];
  document.getElementById('filters').innerHTML=statuses.map(s=>`<button class="filter-btn ${s===filter?'active':''}" onclick="setFilter('${s}',this)">${sl(s)}</button>`).join('');
}
function setFilter(f,el){filter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');render();}
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const filtered=projects.filter(p=>{
    if(filter!=='all'&&p.status!==filter)return false;
    if(q&&!(p.title||'').toLowerCase().includes(q)&&!(p.profiles?.full_name||'').toLowerCase().includes(q))return false;
    return true;
  });
  const g=document.getElementById('grid');
  if(!filtered.length){g.innerHTML='<div class="empty">No projects found</div>';return;}
  g.innerHTML='<div class="projects-grid">'+filtered.map(p=>{
    const col=sc(p.status);
    const convoId = p.conversations?.[0]?.id || '';
    const chatUrl = convoId ? `chat.html?cid=${convoId}` : '#';
    return`<div class="project-card" onclick="if('${convoId}') window.location.href='${chatUrl}'">
      <div class="pc-top">
        <div class="pc-title">${p.title||'Untitled Project'}</div>
        <span class="status-pill" style="background:${col}22;color:${col};">${sl(p.status)}</span>
      </div>
      <div class="pc-meta">
        <span>👤 ${p.profiles?.full_name||'Unknown Client'}</span>
        ${p.experts?`<span>🎯 ${p.experts.name}</span>`:'<span style="color:#555;">No expert assigned</span>'}
        ${p.deadline?`<span>📅 Deadline: ${new Date(p.deadline).toLocaleDateString()}</span>`:''}
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${p.progress||0}%;"></div></div>
      <div class="pc-footer">
        <span class="pc-budget">${fc(p.budget)}</span>
        <div class="pc-actions">
          <button class="btn-sm" onclick="event.stopPropagation(); if('${convoId}') window.location.href='${chatUrl}'">View Chat</button>
        </div>
      </div>
    </div>`;
  }).join('')+'</div>';
}
init();
</script>
</body>
