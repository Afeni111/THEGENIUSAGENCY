<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#F5C542;--gold-dark:#b8950e;--navy:#0a1628;--bg:var(--navy);--bg2:#0d1e36;--bg3:#122848;--border:rgba(245,197,66,0.15);--text:#f0f0f0;--muted:#8a9bb8;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;overflow-x:hidden;}

/* SIDEBAR */
.sidebar{width:220px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;overflow-y:auto;}
.sidebar-logo{padding:20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.logo-badge{background:var(--gold);color:#000;font-size:0.6rem;font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:1px;}
.logo-name{font-size:0.8rem;font-weight:700;color:#fff;line-height:1.2;}
.logo-sub{font-size:0.65rem;color:var(--muted);}
.sidebar-section{padding:12px 0;}
.sidebar-section-label{font-size:0.62rem;font-weight:700;color:#444;letter-spacing:1.5px;padding:0 16px;margin-bottom:6px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--muted);font-size:0.82rem;font-weight:500;cursor:pointer;transition:all 0.2s;text-decoration:none;border-left:3px solid transparent;position:relative;}
.nav-item:hover{color:#fff;background:rgba(255,255,255,0.04);}
.nav-item.active{color:var(--gold);background:rgba(245,197,66,0.08);border-left-color:var(--gold);}
.nav-item svg{width:16px;height:16px;flex-shrink:0;}
.sidebar-bottom{padding:14px 16px;border-top:1px solid var(--border);margin-top:auto;}
.admin-pill{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg3);border-radius:10px;}
.admin-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#b8950e,#F5C542);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.78rem;color:#000;flex-shrink:0;}
.admin-info{flex:1;min-width:0;}
.admin-name{font-size:0.75rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.admin-role{font-size:0.6rem;color:var(--gold);font-weight:600;}
.btn-so{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;}
.btn-so:hover{color:#ef4444;}

/* MAIN */
.main{margin-left:220px;flex:1;padding:24px;display:flex;flex-direction:column;min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.topbar-title{font-size:1.1rem;font-weight:800;color:#fff;}
.search-wrap{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;margin-bottom:20px;max-width:400px;}
.search-wrap input{background:none;border:none;outline:none;color:#fff;font-size:0.85rem;flex:1;}
.search-wrap input::placeholder{color:#555;}
.table-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
thead tr{border-bottom:1px solid var(--border);}
th{font-size:0.65rem;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:0.5px;padding:13px 16px;text-align:left;}
td{font-size:0.8rem;color:var(--text);padding:13px 16px;border-bottom:1px solid rgba(255,255,255,0.03);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,0.02);}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--gold-dark),var(--gold));display:inline-flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;color:#000;margin-right:8px;vertical-align:middle;flex-shrink:0;}
.td-name{font-weight:600;color:#fff;}
.td-muted{color:var(--muted);}
.badge{padding:3px 8px;border-radius:10px;font-size:0.65rem;font-weight:700;}
.badge-active{background:rgba(34,197,94,0.15);color:#22c55e;}
.badge-blocked{background:rgba(239,68,68,0.15);color:#ef4444;}
.badge-flagged{background:rgba(249,115,22,0.15);color:#f97316;}
.btn-sm{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--muted);font-size:0.72rem;cursor:pointer;transition:all 0.2s;margin-right:4px;}
.btn-sm:hover{border-color:rgba(245,197,66,0.35);color:var(--gold);}
.btn-danger{border-color:rgba(239,68,68,0.3);color:#ef4444;}
.btn-danger:hover{background:rgba(239,68,68,0.1);}
.spinner{width:28px;height:28px;border:3px solid rgba(245,197,66,0.15);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:40px auto;display:block;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
    <script src="../js/analytics.js"></script>
</head>
<body>

    <a href="experts.html" class="nav-item">

<div class="main">
  <div class="topbar"><span class="topbar-title">Clients <span id="count" style="font-size:0.8rem;font-weight:500;color:var(--muted);"></span></span></div>
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search" placeholder="Search by name or email..." oninput="render()">
  </div>
  <div class="table-card">
    <table>
      <thead><tr><th>Client</th><th>Email</th><th>Country</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead>
      <tbody id="tbody"><tr><td colspan="6"><div class="spinner"></div></td></tr></tbody>
    </table>
  </div>
</div>
<script>
const SB_URL='https://tjxyxasorunhrtvstwpa.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqeHl4YXNvcnVuaHJ0dnN0d3BhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNzU3NTQsImV4cCI6MjA5MjY1MTc1NH0.YEZPhnJmFAk4IDxd-6LlhKAZfGTkODfGr1FJteA99vo';
const sb=supabase.createClient(SB_URL,SB_KEY);
let clients=[];
function av(n){return(n||'').split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2)||'?';}
function fd(ts){return ts?new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';}
async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='../login.html';return;}
  const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(!p||p.role!=='admin'){window.location.href='../login.html';return;}
  document.getElementById('admin-name').textContent=p.full_name||'Admin';
  document.getElementById('admin-avatar').textContent=(p.full_name||'A').split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2);
  const{data}=await sb.from('profiles').select('*').eq('role','client').order('created_at',{ascending:false});
  clients=data||[];
  document.getElementById('count').textContent='('+clients.length+')';
  render();
}
async function doSignOut(){await sb.auth.signOut();window.location.href='../login.html';}
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const filtered=clients.filter(c=>!q||(c.full_name||'').toLowerCase().includes(q)||(c.email||'').toLowerCase().includes(q));
  const tb=document.getElementById('tbody');
  if(!filtered.length){tb.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:30px;">No clients found</td></tr>';return;}
  tb.innerHTML=filtered.map(c=>`<tr>
    <td><span class="avatar">${av(c.full_name)}</span><span class="td-name">${c.full_name||'—'}</span></td>
    <td class="td-muted">${c.email}</td>
    <td class="td-muted">${c.country||'—'}</td>
    <td>${c.is_blocked?'<span class="badge badge-blocked">Blocked</span>':c.is_flagged?'<span class="badge badge-flagged">Flagged</span>':'<span class="badge badge-active">Active</span>'}</td>
    <td class="td-muted">${fd(c.created_at)}</td>
    <td>
      <button class="btn-sm" onclick="viewChat('${c.id}')">Chat</button>
      <button class="btn-sm ${c.is_flagged?'':'btn-danger'}" onclick="toggleFlag('${c.id}',${!c.is_flagged})">${c.is_flagged?'Unflag':'Flag'}</button>
      <button class="btn-sm btn-danger" onclick="toggleBlock('${c.id}',${!c.is_blocked})">${c.is_blocked?'Unblock':'Block'}</button>
    </td>
  </tr>`).join('');
}
async function viewChat(clientId){
  const{data:c}=await sb.from('conversations').select('id').eq('client_id',clientId).limit(1).single();
  if(c)window.location.href=`chat.html?cid=${c.id}`;
  else alert('No conversation found for this client.');
}
async function toggleFlag(id,val){
  await sb.from('profiles').update({is_flagged:val}).eq('id',id);
  const idx=clients.findIndex(c=>c.id===id);if(idx>-1)clients[idx].is_flagged=val;render();
}
async function toggleBlock(id,val){
  if(val&&!confirm('Block this client?'))return;
  await sb.from('profiles').update({is_blocked:val}).eq('id',id);
  const idx=clients.findIndex(c=>c.id===id);if(idx>-1)clients[idx].is_blocked=val;render();
}
init();
</script>
</body>
