<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#F5C542;--gold-dark:#b8950e;--bg:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;--border:rgba(255,255,255,0.07);--text:#f0f0f0;--muted:#888;--purple:#8b5cf6;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden;}
.sidebar{width:220px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.sl{padding:18px 16px;border-bottom:1px solid var(--border);}
.sl-name{font-size:0.8rem;font-weight:700;color:#fff;}
.sl-badge{display:inline-block;background:rgba(139,92,246,0.2);color:var(--purple);font-size:0.58rem;font-weight:700;padding:2px 7px;border-radius:4px;margin-top:3px;letter-spacing:1px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 16px;color:var(--muted);font-size:0.82rem;font-weight:500;text-decoration:none;border-left:3px solid transparent;transition:all 0.2s;}
.nav-item:hover{color:#fff;background:rgba(255,255,255,0.04);}
.nav-item.active{color:var(--gold);background:rgba(245,197,66,0.08);border-left-color:var(--gold);}
.nav-item svg{width:16px;height:16px;flex-shrink:0;}
.sidebar-bottom{padding:14px;border-top:1px solid var(--border);margin-top:auto;}
.user-pill{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg3);border-radius:10px;}
.user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,var(--purple));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.75rem;color:#fff;flex-shrink:0;}
.user-name{font-size:0.75rem;font-weight:600;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.btn-so{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;}
.btn-so:hover{color:#ef4444;}
/* CHAT */
.chat-wrapper{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.chat-header{height:58px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:12px;flex-shrink:0;}
.ch-back{background:none;border:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:5px;font-size:0.78rem;padding:5px 10px;border-radius:6px;}
.ch-back:hover{color:#fff;background:rgba(255,255,255,0.05);}
.ch-info{flex:1;}
.ch-title{font-size:0.88rem;font-weight:700;color:#fff;}
.ch-sub{font-size:0.68rem;color:var(--muted);margin-top:2px;}
.restriction-notice{background:rgba(139,92,246,0.08);border-bottom:1px solid rgba(139,92,246,0.15);padding:8px 18px;font-size:0.72rem;color:#aaa;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.restriction-notice strong{color:var(--purple);}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
.chat-messages::-webkit-scrollbar{width:4px;}
.chat-messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);}
.msg-row{display:flex;align-items:flex-end;gap:10px;}
.msg-self{flex-direction:row-reverse;}
.msg-avatar{width:30px;height:30px;border-radius:50%;background:var(--bg3);border:1px solid rgba(139,92,246,0.2);display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;color:var(--purple);flex-shrink:0;}
.msg-bubble-wrap{display:flex;flex-direction:column;max-width:65%;}
.msg-self .msg-bubble-wrap{align-items:flex-end;}
.msg-name{font-size:0.65rem;color:var(--muted);margin-bottom:3px;}
.msg-role-tag{background:rgba(139,92,246,0.12);color:var(--purple);padding:1px 5px;border-radius:3px;font-size:0.56rem;margin-left:3px;}
.msg-bubble{padding:9px 13px;border-radius:12px;font-size:0.85rem;line-height:1.5;word-break:break-word;}
.msg-bubble p{margin:0;}
.bubble-other{background:var(--bg3);border:1px solid rgba(255,255,255,0.05);color:#e0e0e0;border-radius:4px 12px 12px 12px;}
.bubble-self{background:linear-gradient(135deg,#7c3aed,var(--purple));color:#fff;font-weight:500;border-radius:12px 4px 12px 12px;}
.msg-time{font-size:0.58rem;color:#555;margin-top:2px;}
.msg-self .msg-time{text-align:right;}
.msg-image{max-width:180px;border-radius:8px;cursor:pointer;}
.msg-file-link{color:var(--gold);text-decoration:none;font-size:0.8rem;}
.msg-system{display:flex;align-items:center;justify-content:center;gap:7px;padding:5px 12px;background:rgba(255,255,255,0.02);border-radius:20px;font-size:0.68rem;color:var(--muted);margin:3px auto;}
.msg-system-dot{width:5px;height:5px;background:var(--purple);border-radius:50%;flex-shrink:0;}
.typing-dots{display:flex;gap:4px;padding:3px 0;}
.typing-dots span{width:6px;height:6px;background:#555;border-radius:50%;animation:bounce 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
/* INPUT */
.chat-input-area{padding:12px 16px;border-top:1px solid var(--border);background:var(--bg2);display:flex;align-items:flex-end;gap:8px;flex-shrink:0;}
.input-wrap{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:12px;display:flex;align-items:flex-end;padding:8px 12px;gap:8px;transition:border-color 0.2s;}
.input-wrap:focus-within{border-color:rgba(139,92,246,0.4);}
#chat-input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:0.86rem;resize:none;max-height:100px;min-height:20px;line-height:1.5;font-family:inherit;}
#chat-input::placeholder{color:#555;}
.ibtn{width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;}
.ibtn-attach{background:rgba(255,255,255,0.05);color:var(--muted);}
.ibtn-attach:hover{background:rgba(255,255,255,0.1);color:#fff;}
.ibtn-send{background:var(--purple);color:#fff;}
.ibtn-send:hover{background:#7c3aed;}
#file-input{display:none;}
/* CONVO LIST (left panel) */
.convo-panel{width:240px;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;background:var(--bg2);}
.cp-header{padding:14px 16px;border-bottom:1px solid var(--border);font-size:0.85rem;font-weight:700;color:#fff;}
.convo-list{flex:1;overflow-y:auto;}
.convo-item{padding:12px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.03);transition:background 0.15s;}
.convo-item:hover{background:rgba(255,255,255,0.03);}
.convo-item.selected{background:rgba(139,92,246,0.07);border-left:2px solid var(--purple);}
.ci-name{font-size:0.82rem;font-weight:600;color:#fff;margin-bottom:3px;}
.ci-preview{font-size:0.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ci-time{font-size:0.62rem;color:#555;margin-top:4px;}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;}
.no-sel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:10px;}
.spinner{width:28px;height:28px;border:3px solid rgba(139,92,246,0.15);border-top-color:var(--purple);border-radius:50%;animation:spin 0.8s linear infinite;}
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
    <script src="../js/analytics.js"></script>
</head>

<script>
const SB_URL='https://tjxyxasorunhrtvstwpa.supabase.co',SB_KEY='sb_publishable_d3YtyYkTynAVyTEVIN19dQ_-4wZkGHV';
const sb=supabase.createClient(SB_URL,SB_KEY);
let expertUser=null,expertProfile=null,expertRecord=null;
let convos=[],activeConvoId=null,chatChannel=null,typingTimer=null;

function av(n){return(n||'').split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2)||'?';}
function ft(ts){if(!ts)return'';const d=new Date(ts),now=new Date(),diff=now-d;if(diff<60000)return'Just now';if(diff<3600000)return Math.floor(diff/60000)+'m ago';if(diff<86400000)return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});return d.toLocaleDateString([],{month:'short',day:'numeric'});}
function sc(s){const m={in_progress:'#10b981',under_review:'#f97316',delivered:'#06b6d4',revision:'#ec4899',completed:'#22c55e',discussing:'#8b5cf6',new_lead:'#3b82f6'};return m[s]||'#888';}

async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='../login.html';return;}
  const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(!p||p.role!=='expert'){window.location.href='../login.html';return;}
  expertUser=session.user;expertProfile=p;
  document.getElementById('exp-name').textContent=p.full_name||p.email;
  document.getElementById('exp-avatar').textContent=av(p.full_name);
  const{data:er}=await sb.from('experts').select('*').eq('profile_id',p.id).single();
  expertRecord=er;
  await loadConvos();
  const params=new URLSearchParams(location.search);
  const cid=params.get('cid');
  if(cid)selectConvo(cid);
  document.getElementById('ls').style.display='none';
}

async function loadConvos(){
  if(!expertRecord){document.getElementById('convo-list').innerHTML='<div style="padding:20px;font-size:0.78rem;color:var(--muted);text-align:center;">Expert record not linked. Contact admin.</div>';return;}
  const{data}=await sb.from('conversations').select('*,projects(title,status)').eq('expert_id',expertRecord.id).order('updated_at',{ascending:false});
  convos=data||[];
  const el=document.getElementById('convo-list');
  if(!convos.length){el.innerHTML='<div style="padding:20px;font-size:0.78rem;color:var(--muted);text-align:center;">No assigned projects yet.</div>';return;}
  el.innerHTML=convos.map(c=>{
    const title=c.projects?.title||'Project';
    const col=sc(c.status);
    return`<div class="convo-item ${c.id===activeConvoId?'selected':''}" onclick="selectConvo('${c.id}')">
      <div class="ci-name"><span class="status-dot" style="background:${col};"></span>${title}</div>
      <div class="ci-preview">${c.last_message||'No messages yet'}</div>
      <div class="ci-time">${ft(c.last_message_at)}</div>
    </div>`;
  }).join('');
}

async function selectConvo(id){
  activeConvoId=id;
  document.getElementById('no-sel').style.display='none';
  const ac=document.getElementById('active-chat');ac.style.display='flex';
  const c=convos.find(x=>x.id===id)||{};
  document.getElementById('ch-title').textContent=c.projects?.title||'Project';
  document.getElementById('ch-sub').textContent='Status: '+(c.status||'—');
  
  // Show Rate Client button only if project is completed
  const rateBtn = document.getElementById('rate-client-btn');
  if(rateBtn) rateBtn.style.display = (c.status === 'completed' || c.status === 'auto_completed') ? 'block' : 'none';

  if(chatChannel)sb.removeChannel(chatChannel);
  await loadMessages(id);
  subscribeChat(id);
  loadConvos();
}

/* REVIEW CLIENT */
let selectedRating = 5;
function openReviewModal(){
  document.getElementById('review-modal').style.display='flex';
  selectedRating = 5;
  updateStars();
}

function updateStars(){
  document.querySelectorAll('.star-r').forEach(s => {
    s.classList.toggle('active', parseInt(s.dataset.value) <= selectedRating);
    s.style.color = parseInt(s.dataset.value) <= selectedRating ? 'var(--gold)' : 'rgba(255,255,255,0.1)';
  });
}

document.addEventListener('click', e => {
  if(e.target.classList.contains('star-r')){
    selectedRating = parseInt(e.target.dataset.value);
    updateStars();
  }
});

async function submitClientReview() {
  const text = document.getElementById('client-review-text').value;
  const btn = document.getElementById('submit-client-review-btn');
  const conv = convos.find(c => c.id === activeConvoId);
  
  if(!conv?.project_id) {
    alert('Project ID not found. Ensure the project is formally started.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Submitting...';

  try {
    const { error } = await sb.from('reviews').insert({
      project_id: conv.project_id,
      client_id: conv.client_id,
      expert_id: expertRecord.id,
      rating: selectedRating,
      review_text: `[EXPERT REVIEW] ${text}`,
      is_auto_completed: false
    });

    if (error) throw error;

    alert('Client rating submitted successfully!');
    document.getElementById('review-modal').style.display='none';
    
    // Send system message
    await sb.from('messages').insert({
      conversation_id: activeConvoId,
      sender_id: expertUser.id,
      sender_role: 'expert',
      content: `⭐ Expert left a ${selectedRating}-star review for the client.`,
      message_type: 'system'
    });

  } catch (err) {
    console.error('Review error:', err);
    alert('Error: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Submit Rating';
  }
}

function clearSelection(){
  activeConvoId=null;
  document.getElementById('no-sel').style.display='flex';
  document.getElementById('active-chat').style.display='none';
}

async function loadMessages(id){
  const{data:msgs}=await sb.from('messages').select('*,profiles!messages_sender_id_fkey(full_name,role)').eq('conversation_id',id).order('created_at',{ascending:true});
  const el=document.getElementById('chat-messages');
  if(!msgs?.length){el.innerHTML='<div class="msg-system"><div class="msg-system-dot"></div><span>Start communicating below</span></div>';return;}
  el.innerHTML=msgs.map(m=>renderMsg(m)).join('');
  el.scrollTop=el.scrollHeight;
}

function renderMsg(m){
  const isSelf=m.sender_id===expertUser.id;
  const name=m.profiles?.full_name||'User';
  const role=m.sender_role||(isSelf?'expert':'admin');
  const time=ft(m.created_at);
  if(m.message_type==='system')return`<div class="msg-system"><div class="msg-system-dot"></div><span>${m.content}</span></div>`;
  const hasFile=m.metadata?.file_url;
  const ext=hasFile?m.metadata.file_name?.split('.').pop()?.toLowerCase():'';
  const imgs=['jpg','jpeg','png','gif','webp'];
  
  return`<div class="msg-row ${isSelf?'msg-self':''}">
    ${!isSelf?`<div class="msg-avatar">${av(name)}</div>`:''}
    <div class="msg-bubble-wrap">
      <div class="msg-header" style="display:flex;align-items:center;gap:6px;margin-bottom:4px;${isSelf?'flex-direction:row-reverse;':''}">
        <span class="msg-name" style="font-weight:700;">${name}</span>
        <span class="msg-role-tag" style="background:rgba(139,92,246,0.1);color:var(--purple);padding:1px 6px;border-radius:4px;font-size:0.55rem;text-transform:uppercase;font-weight:800;">${role}</span>
      </div>
      <div class="msg-bubble ${isSelf?'bubble-self':'bubble-other'}">
        ${hasFile&&imgs.includes(ext)?`<img src="${m.metadata.file_url}" class="msg-image" onclick="window.open('${m.metadata.file_url}','_blank')">`
          :hasFile?`<a href="${m.metadata.file_url}" class="msg-file-link">📎 ${m.metadata.file_name||'File'}</a>`
          :`<p>${(m.content||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</p>`}
      </div>
      <span class="msg-time">${time}${isSelf?' ✓':''}</span>
    </div>
  </div>`;
}

function subscribeChat(id){
  chatChannel=sb.channel('expert-chat:'+id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+id},async(p)=>{
      const m=p.new;
      if(m.sender_id===expertUser.id)return;
      const{data:prof}=await sb.from('profiles').select('full_name,role').eq('id',m.sender_id).single();
      const el=document.getElementById('chat-messages');
      el.insertAdjacentHTML('beforeend',renderMsg({...m,profiles:prof}));
      el.scrollTop=el.scrollHeight;
      document.getElementById('typing-indicator')?.remove();
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'typing_indicators',filter:'conversation_id=eq.'+id},(p)=>{
      if(p.new.user_id===expertUser.id)return;
      const el=document.getElementById('typing-indicator');
      if(p.new.is_typing){
        if(!el){const t=document.createElement('div');t.id='typing-indicator';t.className='msg-row';t.innerHTML=`<div class="msg-avatar">A</div><div class="msg-bubble-wrap"><div class="msg-bubble bubble-other"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>`;document.getElementById('chat-messages').appendChild(t);document.getElementById('chat-messages').scrollTop=99999;}
      }else el?.remove();
    })
    .subscribe();
}

async function sendMsg(){
  const inp=document.getElementById('chat-input');
  const txt=inp.value.trim();
  if(!txt||!activeConvoId)return;
  inp.value='';inp.style.height='auto';
  setTyping(false);
  await sb.from('messages').insert({conversation_id:activeConvoId,sender_id:expertUser.id,sender_role:'expert',content:txt,message_type:'normal'});
  const el=document.getElementById('chat-messages');
  el.insertAdjacentHTML('beforeend',renderMsg({sender_id:expertUser.id,sender_role:'expert',content:txt,message_type:'normal',created_at:new Date().toISOString(),profiles:{full_name:expertProfile.full_name,role:'expert'}}));
  el.scrollTop=el.scrollHeight;
}

function setTyping(v){
  if(!activeConvoId)return;
  sb.from('typing_indicators').upsert({conversation_id:activeConvoId,user_id:expertUser.id,is_typing:v,updated_at:new Date().toISOString()}).then(()=>{});
}

document.addEventListener('DOMContentLoaded',()=>{
  const inp=document.getElementById('chat-input');
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
  inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,100)+'px';setTyping(true);clearTimeout(typingTimer);typingTimer=setTimeout(()=>setTyping(false),2000);});
  document.getElementById('file-input').addEventListener('change',async(e)=>{
    if(!activeConvoId)return;
    for(const file of Array.from(e.target.files)){
      const path=`${activeConvoId}/expert_${Date.now()}_${file.name}`;
      const{data:up}=await sb.storage.from('deliveries').upload(path,file,{upsert:true});
      if(up){
        const{data:url}=sb.storage.from('deliveries').getPublicUrl(path);
        await sb.from('messages').insert({conversation_id:activeConvoId,sender_id:expertUser.id,sender_role:'expert',content:`[WORK FILE: ${file.name}] — Sent to admin for review`,message_type:'normal',metadata:{file_url:url.publicUrl,file_name:file.name}});
        const el=document.getElementById('chat-messages');
        el.insertAdjacentHTML('beforeend',renderMsg({sender_id:expertUser.id,sender_role:'expert',content:`[WORK FILE: ${file.name}]`,message_type:'normal',created_at:new Date().toISOString(),metadata:{file_url:url.publicUrl,file_name:file.name},profiles:{full_name:expertProfile.full_name,role:'expert'}}));
        el.scrollTop=el.scrollHeight;
      }
    }
    e.target.value='';
  });
});

async function doSignOut(){await sb.auth.signOut();window.location.href='../login.html';}
init();
</script>
